<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <form id="userform">

            <h1>Personal Information</h1>

            <p class="para">Please enter your information below</p>

            <!-- username  -->
            <div class="form-group">
                <label for="usernmae" id="label">Username</label>
                <input type="text" id="username" class="input" onfocus="this.style.color='#00ffff'" required>
            </div><br>

            <!-- email -->
            <div class="form-group">
                <label for="email" id="label">Email</label>
                <input type="text" id="email" class="input" onfocus="this.style.color='#00ffff'"  required>
            </div><br>

            <!-- password -->
            <div class="form-group">
                <label for="password" id="label">Password</label>
                <input type="password" id="password" class="input" onfocus="this.style.color='#00ffff'"  required>
            </div><br>

            <!-- age -->
            <div class="form-group" >
                <label for="Age" id="label" >Age</label>

                <input type="text" id="age" class="input" onfocus="this.style.color='#00ffff'"  required>
            </div><br>

            <!-- Gender -->
            <div class="gender">
                <label for="Gender" id="label">Gender</label>

                <input type="radio" id="male" name="gender" value="male">
                <label id="male" for="male">Male</label>

                <input type="radio" id="Female" name="gender" value="Female">
                <label id="Female" for="Female">Female</label>

                <input type="radio" id="Other" name="gender" value="Other">
                <label id="Other" for="Female">Other</label>
            </div><br>

            <!-- City -->
            <div class="form-group">
                <label for="city" id="label">City</label>
                <input type="text" id="city" class="input" onfocus="this.style.color='#00ffff'"  required>
            </div><br>

            <!-- Submit Button -->
            <div class="submit">
                <button type="submit" id="btn">Submit</button>
            </div><br>
 

        </form>

    </main>

    <script src="app.js"></script>
</body>

</html>
