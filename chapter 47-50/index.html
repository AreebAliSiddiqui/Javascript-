<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <form id="userform">

            <h1>Personal Information</h1>

            <p class="para">Please enter your information below</p>

            <!-- username  -->
            <div class="usernmae">
                <label for="usernmae">Username</label>
                <input type="text" id="username" onfocus="this.style.color='red'" onblur="this.style.color='black'" required>
            </div><br>

            <!-- email -->
            <div class="email">
                <label for="email">Email</label>
                <input type="text" id="email" onfocus="this.style.color='red'" onblur="this.style.color='black'" required>
            </div><br>

            <!-- password -->
            <div class="pass">
                <label for="password">Password</label>
                <input type="password" id="password" onfocus="this.style.color='red'" onblur="this.style.color='black'" required>
            </div><br>

            <!-- age -->
            <div class="age" >
                <label for="Age">Age</label>

                <input type="number" id="age" required>
            </div><br>

            <!-- Gender -->
            <div class="gender">
                <label for="Gender">Gender</label>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="Female" name="gender" value="Female">
                <label for="Female">Female</label>

                <input type="radio" id="Other" name="gender" value="Other">
                <label for="Female">Other</label>
            </div><br>

            <!-- City -->
            <div class="city">
                <label for="city">City</label>
                <input type="text" id="City" required>
            </div><br>

            <!-- Submit Button -->
            <div class="submit">
                <button type="submit" id="btn" onmouseover="this.style.color='red'" onmouseout="this.style.color='black'"> Submit</button>
            </div><br>


        </form>

    </main>

    <script src="app.js"></script>
</body>

</html>
