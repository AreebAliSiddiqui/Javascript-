<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1 class="main-head">Sound</h1>
        <h1 class="main-head1">Wave</h1>
    </nav>

    <section class="main">
        <div class="image">
           <button class="arrow1" onclick="previousProduct()">←</button>
            <img src="images/headphone.jpg" alt="headphone" id="image">
           <button class="arrow2" onclick="changeProduct()">→</button>
        </div>
        <div class="description">
          <h1 class="name" id="name">Sonic Pro X</h1>
          <h2 class="type" id="type">Wireless Headphones</h2>
          <p class="details" id="details">Premium sound & comfort.</p>
          <h2 class="price" id="price">1500 PKR</h2>
          <div class="buttons">
          <button class="buy">Buy Now</button>
          <button class="change" onclick="changeProduct()">Change Product</button>
          </div>
          </div>
        </div>
        <div class="userinfo">
            <label for="username" class="label">Username</label>
            <input type="text" id="username">
            <button id="submit" onclick="greet()">Submit</button>
            <div class="cover">
            <p id="para1">Hello,there</p>
            <p id="para2">Thank you for shopping!</p>
            </div>          
        </div>
 
    </section>

    <script src="app.js"></script>
</body>
</html>
