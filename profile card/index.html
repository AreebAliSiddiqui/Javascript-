<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="heading">
            <div class="title">
                <h1 class="head">MY</h1>
                <h1 class="head">DIGITAL</h1>
                <h1 class="head">PROFILE</h1>
            </div>
            <div>
                <ul class="tagline">
                    <li class="Code">Code</li>
                    <li>Create</li>
                    <li>Build</li>
                    <li>Grow</li>
                </ul>
            </div>
        </header>

        <main class="main">
            <section class="main-section">
                <div class="profile">
                    <img src="images/man.png" alt="Profile image">
                </div>
                <div class="bio">
                    <div class="sticker">
                        <h1 class="tag">
                            </> MY DIGITAL PROFILE</h1>
                    </div>
                    <h2 class="name">AREEB ALI SIDDIQUI</h1>
                        <h2 class="role">FRONTEND DEVELOPER</h1>
                            <p class="description">Turning ideas into clean, responsive and user-friendly web experince.
                            </p>
                            <div class="status">● AVAILABLE FOR WORK</div>



                            <button class="profile-btn">Change Profile</button>
                            <button class="image-btn">Change Image</button>

                </div>

            </section>

            <div class="side-section">
             <div class="side-head">
                <h2>Introduce Yourself</h2>
             </div>
             <div class="input">
                <label for="name">Enter Your Name:</label>
                <input type="text" id="name"  placeholder="e.g. Areeb">
             </div>

             <div class="btn">
                <button id="submit">Introduce ME</button>
             </div>

             <div class="message">
                <p class="p1">Hello,there !</p>
                <p class="p2">Nice to meet you!😊</p>
             </div>

            </div>

            <div class="skills">

            </div>


        </main>
    </div>


    <script src="app.js"></script>
</body>

</html>
